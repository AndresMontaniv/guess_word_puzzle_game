name: guess_word_game
description: "Guess The Word — an offline logic deduction word puzzle."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/macos/AppIcon1024.png"
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/macos/AppIcon1024.png"

flutter:
  uses-material-design: true
